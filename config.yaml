# =============================================================================
# Telco Customer Churn Prediction — Central Configuration
# Mini Project 0 | Principal MLOps & Data Scientist
# =============================================================================
# All pipeline parameters are sourced from this file.
# DO NOT hardcode any values in the Python source modules.
# =============================================================================

# ─────────────────────────────────────────────
# PROJECT METADATA
# ─────────────────────────────────────────────
project:
  name: "Telco Customer Churn Prediction"
  version: "1.0.0"
  random_state: 42
  log_level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  log_file: "logs/pipeline.log"
  log_format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"

# ─────────────────────────────────────────────
# DATA PATHS & SCHEMA
# ─────────────────────────────────────────────
data:
  raw_path: "data/raw/telco_churn.csv"
  processed_path: "data/processed"
  splits_path: "data/splits"
  target_col: "Churn"
  customer_id_col: "customerID"
  limit_training_rows: 5000

  schema:
    # All expected columns in the raw CSV
    expected_columns:
      - "customerID"
      - "gender"
      - "SeniorCitizen"
      - "Partner"
      - "Dependents"
      - "tenure"
      - "PhoneService"
      - "MultipleLines"
      - "InternetService"
      - "OnlineSecurity"
      - "OnlineBackup"
      - "DeviceProtection"
      - "TechSupport"
      - "StreamingTV"
      - "StreamingMovies"
      - "Contract"
      - "PaperlessBilling"
      - "PaymentMethod"
      - "MonthlyCharges"
      - "TotalCharges"
      - "Churn"

    # Columns that are naturally numerical
    numerical_cols:
      - "tenure"
      - "MonthlyCharges"
      - "TotalCharges"

    # Columns that are categorical (non-binary)
    categorical_cols:
      - "gender"
      - "MultipleLines"
      - "InternetService"
      - "OnlineSecurity"
      - "OnlineBackup"
      - "DeviceProtection"
      - "TechSupport"
      - "StreamingTV"
      - "StreamingMovies"
      - "Contract"
      - "PaymentMethod"

    # Binary Yes/No columns (will be mapped 1/0)
    binary_yes_no_cols:
      - "Partner"
      - "Dependents"
      - "PhoneService"
      - "PaperlessBilling"
      - "Churn"

    # Columns that need type coercion (string → numeric)
    coerce_to_numeric:
      - "TotalCharges"

    # SeniorCitizen is already 0/1 in the IBM dataset
    already_binary_cols:
      - "SeniorCitizen"

# ─────────────────────────────────────────────
# PREPROCESSING
# ─────────────────────────────────────────────
preprocessing:

  missing_values:
    strategy: "median"        # mean | median | mode | knn
    knn_neighbors: 5          # used only when strategy == knn
    numerical_impute_cols:
      - "TotalCharges"        # TotalCharges has ~11 missing values in IBM dataset
    categorical_impute_cols: []

  outlier:
    method: "iqr"             # iqr | zscore
    iqr_factor: 1.5
    zscore_threshold: 3.0
    action: "cap"             # cap (Winsorize) | remove
    columns_to_check:
      - "tenure"
      - "MonthlyCharges"
      - "TotalCharges"

  encoding:
    method: "onehot"          # onehot | label | target
    drop_first: true          # avoid dummy-variable trap
    binary_map:
      "Yes": 1
      "No": 0
    # Columns to apply target encoding (populated when method==target)
    target_encoding_cols: []

  scaling:
    method: "standard"        # standard | minmax | robust
    columns_to_scale:
      - "tenure"
      - "MonthlyCharges"
      - "TotalCharges"
      - "service_adoption_score"
      - "avg_monthly_charge_per_service"
      - "charge_to_tenure_ratio"

  binning:
    enabled: true
    columns:
      - col: "tenure"
        n_bins: 5
        strategy: "quantile"  # uniform | quantile
        labels: ["0-20%ile", "20-40%ile", "40-60%ile", "60-80%ile", "80-100%ile"]
      - col: "MonthlyCharges"
        n_bins: 4
        strategy: "quantile"
        labels: ["Budget", "Standard", "Premium", "Ultra"]

# ─────────────────────────────────────────────
# FEATURE ENGINEERING
# ─────────────────────────────────────────────
feature_engineering:

  # Tenure segmentation (month-based breakpoints)
  # Produces: tenure_category column
  tenure_bins: [0, 12, 24, 48, 60, 73]       # right-inclusive edges; 73 covers max tenure=72
  tenure_labels: ["New", "Developing", "Established", "Loyal", "Champion"]

  # Columns counted for service adoption score
  # Services mapped: "Yes"=1, "No internet service"=0, "No"=0
  service_cols:
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"

  # Numerical column references
  monthly_charge_col: "MonthlyCharges"
  total_charge_col: "TotalCharges"
  tenure_col: "tenure"

  # Payment reliability: these methods are auto-pay → reliable=1
  auto_payment_methods:
    - "Bank transfer (automatic)"
    - "Credit card (automatic)"
  payment_method_col: "PaymentMethod"

  # Contract type reference
  contract_col: "Contract"

  # Internet service reference
  internet_service_col: "InternetService"

  # Derived feature names (used downstream for consistency)
  derived_cols:
    tenure_category: "tenure_category"
    service_adoption_score: "service_adoption_score"
    avg_monthly_charge_per_service: "avg_monthly_charge_per_service"
    charge_to_tenure_ratio: "charge_to_tenure_ratio"
    payment_reliability: "payment_reliability"
    intl_usage_flag: "intl_usage_flag"
    has_internet: "has_internet"
    is_long_term_contract: "is_long_term_contract"
    num_streaming_services: "num_streaming_services"
    num_security_services: "num_security_services"

# ─────────────────────────────────────────────
# DATA SPLITTING
# ─────────────────────────────────────────────
split:
  test_size: 0.20           # 20% held out as test set
  val_size: 0.125           # 12.5% of train → 10% of total
  stratify: true            # stratify on target_col
  random_state: 42
  save_format: "csv"        # csv | parquet

# ─────────────────────────────────────────────
# MODEL DEVELOPMENT
# ─────────────────────────────────────────────
model:

  # Which models to train (order determines evaluation sequence)
  models_to_train:
    - "logistic_regression"
    - "decision_tree"
    - "random_forest"
    - "xgboost"
    - "catboost"

  # Metric used to elect the champion
  champion_metric: "roc_auc"  # roc_auc | f1 | pr_auc

  # Artefact paths
  models_dir: "models"
  champion_dir: "models/champion"
  champion_metadata_file: "models/champion/champion_metadata.json"

  # Cross-validation
  cv_folds: 5
  scoring_metric: "roc_auc"

  # Class imbalance handling
  imbalance_strategy: "smote"   # smote | class_weight | none
  smote_k_neighbors: 5

  # Hyperparameter search
  hyperparameter_search: "random"   # grid | random
  n_iter_random_search: 20
  search_cv_folds: 3                # inner CV for search
  search_n_jobs: -1

  # Hyperparameter grids (used by GridSearchCV or RandomizedSearchCV)
  hyperparams:

    logistic_regression:
      C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      solver: ["lbfgs", "liblinear"]
      max_iter: [500]
      penalty: ["l2"]

    decision_tree:
      max_depth: [3, 5, 7, 10, 15, null]
      min_samples_split: [2, 5, 10, 20]
      min_samples_leaf: [1, 2, 4, 8]
      criterion: ["gini", "entropy"]
      class_weight: [null, "balanced"]

    random_forest:
      n_estimators: [100, 200, 300, 500]
      max_depth: [5, 10, 15, 20, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      max_features: ["sqrt", "log2"]
      bootstrap: [true]

    xgboost:
      n_estimators: [100, 200, 300, 500]
      max_depth: [3, 4, 5, 6, 7]
      learning_rate: [0.005, 0.01, 0.05, 0.1, 0.2]
      subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
      colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]
      gamma: [0, 0.05, 0.1, 0.2, 0.3]
      min_child_weight: [1, 3, 5]
      reg_alpha: [0, 0.01, 0.1]
      reg_lambda: [0.5, 1.0, 2.0]

    catboost:
      iterations: [100, 200, 300, 500]
      depth: [4, 5, 6, 7, 8]
      learning_rate: [0.01, 0.03, 0.05, 0.1, 0.2]
      l2_leaf_reg: [1, 3, 5, 7, 10]
      border_count: [32, 64, 128]
      bagging_temperature: [0.0, 0.5, 1.0]

# ─────────────────────────────────────────────
# EVALUATION
# ─────────────────────────────────────────────
evaluation:

  # Metric used for threshold optimisation
  threshold_metric: "f1"    # f1 | recall | precision | cost

  threshold_range:
    start: 0.10
    stop: 0.90
    step: 0.05

  # Business cost matrix (USD)
  cost_matrix:
    fp_cost: 10.0    # Cost of retaining a non-churner (wasted retention offer)
    fn_cost: 500.0   # Cost of missing a churner (lost revenue over remaining LTV)

  # Which plots to generate (saved to reports/figures/)
  plots:
    roc_curve: true
    pr_curve: true
    confusion_matrix: true
    feature_importance: true
    learning_curves: true
    threshold_analysis: true
    calibration_curve: true

# ─────────────────────────────────────────────
# REPORTING & BUSINESS
# ─────────────────────────────────────────────
reporting:
  figures_dir: "reports/figures"
  executive_summary_path: "reports/Executive_Summary_and_Business_Impact.md"

  # Risk tier thresholds (churn probability)
  high_risk_threshold: 0.70
  medium_risk_threshold: 0.40

  # Business parameters (USD)
  business:
    avg_monthly_revenue_per_customer: 65.0    # ARPU in USD
    avg_customer_lifetime_months: 32.0         # average tenure at churn
    retention_offer_cost: 50.0                 # cost of targeted retention offer
    retention_success_rate: 0.35               # fraction of at-risk customers saved

# ─────────────────────────────────────────────
# STREAMING INFERENCE (Local Simulation)
# ─────────────────────────────────────────────
streaming:
  delay_seconds: 0.5       # seconds between row predictions
  batch_size: 10           # rows per micro-batch
  log_predictions: true
  output_file: "logs/streaming_predictions.jsonl"

# ─────────────────────────────────────────────
# EDA SETTINGS
# ─────────────────────────────────────────────
eda:
  sample_n_for_plots: 2000      # subsample for heavy scatter plots
  correlation_method: "spearman"  # pearson | spearman | kendall
  cluster_k: 3                   # KMeans segments
  figsize_default: [12, 6]
  palette: "viridis"

# ─────────────────────────────────────────────
# KAFKA STREAMING CONFIGURATION
# ─────────────────────────────────────────────
kafka:
  bootstrap_servers: "127.0.0.1:9092"
  topic: "telco-churn-topic"
  group_id: "telco-churn-consumer-group"
  producer:
    delay_seconds: 5.0
    batch_size: 10
    skip_rows: 5000
  consumer:
    output_file: "logs/kafka_predictions.jsonl"
    poll_timeout_seconds: 1.0
