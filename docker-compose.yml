version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: telco_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - telco_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: telco_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 127.0.0.1 දාලා හැදුවම Windows host එකටයි Docker එකටයි දෙකටම පටලැවෙන්නේ නැතුව අහුවෙනවා
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - telco_network

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: telco_kafka_setup
    depends_on:
      - kafka
    entrypoint: [ "bash", "-c", "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telco-churn-topic --partitions 1 --replication-factor 1" ]
    networks:
      - telco_network

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_airflow
    depends_on:
      - kafka
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/src/orchestration/dags"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "sqlite:////opt/airflow/airflow.db"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/airflow
    command: >
      bash -c "airflow db init &&
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true &&
      exec airflow standalone"
    networks:
      - telco_network

networks:
  telco_network:
    driver: bridge